<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OuiSpeak - სავარჯიშოები</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        th:first-child, td:first-child {
            width: 40px;
            white-space: nowrap;
        }
        
        :root {
            --primary: #0055a5;
            --secondary: #ef4135;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 40px -15px rgba(0, 0, 0, 0.15);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Premium Brand Wrapper Box */
        .premium-container-box {
            max-width: 1200px;
            margin: 0.5rem auto;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: var(--shadow-lg), 0 4px 30px rgba(0, 0, 0, 0.03);
            box-sizing: border-box;
        }

        /* Modernized Header */
        header {
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
            border-radius: var(--radius-md) var(--radius-md) 0 0;
        }

        .header-container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-wrapper {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: var(--transition);
        }

        .brand-wrapper:hover {
            opacity: 0.9;
        }

        .brand-logo {
            height: 42px;
            width: auto;
            object-fit: contain;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap; /* 👈 This forces items to the next line when there's no room */
            gap: 2rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
            position: relative;
            padding: 0.25rem 0;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .logout-btn {
            background-color: #fee2e2;
            color: #ef4135;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            display: none;
        }

        .logout-btn:hover {
            background-color: #fca5a5;
        }

        /* Clean Glassmorphism Auth Section */
        #authSection {
            max-width: 420px;
            margin: 5rem auto;
            padding: 3rem 2.5rem;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: block !important; /* Forces form groups to stay visible */
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.88rem;
            color: #475569;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: var(--transition);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(0, 85, 165, 0.1);
        }

        .auth-btn {
            width: 100%;
            background-color: var(--text-main);
            color: white;
            padding: 0.9rem;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.5rem;
        }

        .auth-btn:hover {
            background-color: var(--primary);
            transform: translateY(-1px);
        }

        .auth-error {
            background-color: #fff1f2;
            color: #e11d48;
            border: 1px solid #ffe4e6;
            padding: 0.85rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 500;
        }

        #protectedContent {
            display: none;
        }

        /* Modern Hero Typography */
        .intro-section {
            max-width: 800px;
            margin: 4rem auto 2.5rem auto;
            text-align: center;
            padding: 0 1.5rem;
            position: relative;
        }

        .intro-section h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
        }

        /* Decorative Background Elements */
        .intro-section::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        main {
            max-width: 1140px;
            margin: 0 auto 5rem auto;
            padding: 0 1.5rem;
        }

        /* Exercise Interface Window Settings */
        .subject-selector-wrapper {
            max-width: 500px;
            margin: 0 auto 2rem auto;
            text-align: center;
        }

        .subject-select {
            width: 100%;
            padding: 0.85rem 1.25rem;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            font-size: 1rem;
            color: var(--text-main);
            background-color: var(--bg-card);
            box-shadow: var(--shadow-sm);
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1.25rem center;
            background-size: 1rem;
            transition: var(--transition);
        }

        .subject-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 85, 165, 0.1);
        }

        .exercise-window {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 4rem;
        }

        .exercise-layout-body {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 500px;
        }

        .exercise-sidebar {
            background: #fafafa;
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sidebar-item {
            background: transparent;
            border: none;
            padding: 0.85rem 1.25rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            text-align: left;
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-item:hover {
            background: #f1f5f9;
            color: var(--primary);
            padding-left: 1.5rem;
        }

        .sidebar-item.active {
            background: #e6f0fa;
            color: var(--primary);
            font-weight: 600;
        }

        .exercise-viewarea {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--bg-card);
            min-width: 0; /* Prevents text overflow cutting out */
        }

        .instruction-box {
            background: #ffffff;
            padding: 1.4rem 2rem;
            margin-bottom: 2.5rem;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.01em;
            color: #0f172a;
            border-radius: 20px;
            position: relative;
            
            /* Flexbox to perfectly center content both vertically and horizontally */
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            
            /* Multi-layered shadow for clean, strong visibility */
            box-shadow: 
                0 15px 35px -5px rgba(0, 85, 165, 0.12), 
                0 5px 15px rgba(0, 0, 0, 0.06), 
                inset 0 1px 1px rgba(255, 255, 255, 1);
            border: 1px solid transparent;
            background-clip: padding-box;
            box-sizing: border-box; /* Ensures padding does not break layout */
        }

        /* Sophisticated glowing gradient line border */
        .instruction-box::after {
            content: '';
            position: absolute;
            top: -1px; bottom: -1px; left: -1px; right: -1px;
            background: linear-gradient(135deg, var(--primary) 0%, #00d2ff 50%, var(--secondary) 100%);
            z-index: -1;
            border-radius: 20px;
            opacity: 0.85;
        }

        .exercise-sentence-item {
            font-size: 1.15rem;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            line-height: 2.2rem;
            background: #f8fafc;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            word-wrap: break-word; /* Crucial for responsive text wrapping */
            overflow-wrap: break-word;
        }

        .blank-input {
            border: none;
            border-bottom: 2px dashed #b4bfcd;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            outline: none;
            background: transparent;
            padding: 0 4px;
            margin: 0 6px;
            transition: var(--transition);
            max-width: 100%; /* Ensures inputs don't stretch past content boxes */
            box-sizing: border-box;
        }

        .blank-input:focus {
            border-bottom-color: var(--primary);
            background: rgba(0, 85, 165, 0.02);
        }

        .blank-input.correct {
            border-bottom-color: #10b981;
            color: #10b981;
            background: rgba(16, 185, 129, 0.05);
        }

        .blank-input.incorrect {
            border-bottom-color: var(--secondary);
            color: var(--secondary);
            background: rgba(239, 65, 53, 0.05);
        }

        /* Audio, Video & Text Box Container Styles */
        .audio-player-container, .text-file-container, .video-player-container {
            margin: 1.5rem 0;
            text-align: center;
            background: #f1f5f9;
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px dashed var(--primary);
            box-sizing: border-box;
            max-width: 100%;
        }
        
        .audio-player-container audio {
            width: 100%;
            max-width: 500px;
        }

        .video-player-container {
            margin: 1.5rem 0;
            text-align: center;
            background: #f1f5f9;
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px dashed var(--primary);
            box-sizing: border-box;
            max-width: 100%;
        }

        .video-player-container video {
            width: 100%;
            max-width: 600px;
            border-radius: var(--radius-sm);
            outline: none;
        }

        .text-file-container {
            text-align: left;
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            max-height: 300px;
            overflow-y: auto;
            font-size: 1.05rem;
            line-height: 1.8;
            white-space: pre-line;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        /* Multiple Choice & Radio Option Styles */
        .options-group {
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            background: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            word-break: break-word;
        }

        .option-label:hover {
            background: #f8fafc;
            border-color: var(--primary);
        }

        .option-label.correct-choice {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.05);
            color: #10b981;
            font-weight: 600;
        }

        .option-label.incorrect-choice {
            border-color: var(--secondary);
            background: rgba(239, 65, 53, 0.05);
            color: var(--secondary);
        }

        /* Essay Textarea Styles */
        .essay-textarea-input {
            width: 100%;
            height: 250px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1.05rem;
            font-family: inherit;
            line-height: 1.6;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            transition: var(--transition);
            background-color: #f8fafc;
        }

        .essay-textarea-input:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 85, 165, 0.1);
        }

        .word-counter-view {
            text-align: right;
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 0.35rem;
            font-weight: 500;
        }

        .action-buttons-wrapper {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap; /* Ensures buttons don't clip on small screens */
        }

        .send-answers-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .send-answers-btn:hover {
            background-color: #004487;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 85, 165, 0.15);
        }

        .download-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .download-btn:hover {
            background-color: #059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
        }

        .result-feedback {
            margin-top: 1rem;
            font-weight: 600;
            font-size: 1rem;
            width: 100%; /* Spans full row if needed on mobile */
        }

        /* Modern Stylish Footer Styling */
        footer {
            margin-top: 5rem;
            padding: 2rem 1.5rem 0.5rem 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .footer-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            margin: 0;
            padding: 0;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        .footer-copyright {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .premium-container-box { padding: 0.75rem; border-radius: var(--radius-lg); }
            .header-container { flex-direction: column; gap: 1.25rem; text-align: center; padding: 1.25rem 1rem; }
            nav { width: 100%; justify-content: center; flex-direction: column; gap: 1rem; }
            
            .nav-links { 
                gap: 1.25rem; 
                justify-content: center; 
            }
            
            #authSection { margin: 2rem auto; padding: 2rem 1.5rem; }
            .modal-content { padding: 1.5rem; }
            .modal-header-container { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .download-btn { width: 100%; justify-content: center; }
            footer { flex-direction: column; text-align: center; gap: 1.25rem; padding-top: 1.5rem; }
            .footer-links { justify-content: center; gap: 1.5rem; }

            /* 🌟 CRITICAL MOBILE RESPONSIVE FIXES FOR EXERCISE LAYOUT */
            .exercise-layout-body {
                grid-template-columns: 1fr; /* Stack layout vertically instead of forcing two columns */
                min-height: auto;
            }

            .exercise-sidebar {
                border-right: none;
                border-bottom: 1px solid var(--border-color); /* Separator on bottom instead of right */
                flex-direction: row; /* Horizontal alignment for exercise selector tabs */
                flex-wrap: wrap; /* Allows wrap if row runs out of viewport width */
                justify-content: center;
                padding: 1rem;
            }

            .sidebar-item {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }

            .sidebar-item:hover {
                padding-left: 1rem; /* Reset padding-left push effect for mobile aesthetics */
            }

            .exercise-viewarea {
                padding: 1.25rem; /* Reduces compressed excessive spacing inside answers box */
            }

            .instruction-box {
                padding: 1rem 1.25rem;
                font-size: 1.05rem;
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="premium-container-box">

        <header>
            <div class="header-container">
                <a href="index.html" class="brand-wrapper">
                    <img src="images/logo.png" alt="Lingone Logo" class="brand-logo">
                </a>
                <nav>
                    <ul class="nav-links">
                        <li><a href="index.html">კურსები</a></li>
                        <li><a href="exercice.html" style="color: var(--primary); font-weight: 600;">სავარჯიშოები</a></li>
                        <li><a id="vocabNavLink" href="vocab.html" style="cursor: pointer;">ლექსიკა</a></li>
                        <li><a href="recordings.html">ჩანაწერები</a></li>
                        <li><a href="scores.html">შეფასებები</a></li>
                    </ul>
                    <button class="logout-btn" id="logoutBtn" onclick="handleLogout()">გამოსვლა</button>
                </nav>
            </div>
        </header>

        <section id="authSection">
            <h2 id="authTitle" style="text-align: center; margin-bottom: 2rem; font-weight: 800; letter-spacing: -0.02em;">სავარჯიშოებზე წვდომა</h2>
            <div class="auth-error" id="authError"></div>
            
            <form id="authForm" onsubmit="submitForm(event)">
                <div class="form-group" id="studentIdGroup">
                    <label>სტუდენტის ID (Student ID)</label>
                    <input type="text" id="studentIdInput" required>
                </div>
                <div class="form-group" id="emailGroup">
                    <label>ელ-ფოსტა (Email)</label>
                    <input type="email" id="emailInput" required>
                </div>
                <div class="form-group" id="passwordGroup">
                    <label>პაროლი (Password)</label>
                    <input type="password" id="passwordInput" required minlength="6">
                </div>
                <button type="submit" class="auth-btn">შესვლა</button>
            </form>
        </section>

        <div id="protectedContent">
            <div class="intro-section">
                <h1 id="exerciseTitle">ონლაინ სავარჯიშოები</h1>
            </div>

            <main>
                <div class="subject-selector-wrapper">
                    <select id="subjectSelect" class="subject-select" onchange="handleSubjectChange()">
                        <option value="" disabled selected>აირჩიეთ კვირა</option>
                        <option value="kvira_1">კვირა 1</option>
                        <option value="kvira_2">კვირა 2</option>
                        <option value="kvira_3">კვირა 3</option>
                        <option value="kvira_4">კვირა 4</option>
                        <option value="kvira_5">კვირა 5</option>
                        <option value="kvira_6">კვირა 6</option>
                        <option value="kvira_7">კვირა 7</option>
                        <option value="kvira_8">კვირა 8</option>
                        <option value="kvira_9">კვირა 9</option>
                        <option value="kvira_10">კვირა 10</option>
                        <option value="kvira_11">კვირა 11</option>
                        <option value="kvira_12">კვირა 12</option>
                        <option value="kvira_13">კვირა 13</option>
                        <option value="kvira_14">კვირა 14</option>
                        <option value="kvira_15">კვირა 15</option>
                        <option value="kvira_16">კვირა 16</option>
                        <option value="kvira_17">კვირა 17</option>
                        <option value="kvira_18">კვირა 18</option>
                        <option value="kvira_19">კვირა 19</option>

        function showError(msg) {
            const errBox = document.getElementById('authError');

            errBox.style.display = "block";
        }

        async function handleAuthSubmit(email, password, studentId) {
            const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({ email, password });
            if (authError) return showError(authError);

            const { data: studentData, error: dbError } = await _supabase
                .from('Students')
                .select('id, course, is_active')
                .eq('id', studentId)
                .eq('email', email)
                .maybeSingle();

            if (dbError || !studentData) {
                await _supabase.auth.signOut();
                return showError("არასწორი სტუდენტის ID ან ელ-ფოსტა.");
            }

            if (studentData.is_active === false) {
                await _supabase.auth.signOut();
                return showError("პლატფორმაზე წვდომა შეგეზღუდათ დავალიანების გამო. გთხოვთ, დაუკავშირდეთ ადმინისტრაციას.");
            }

            checkUserSession();
        }

        function submitForm(e) {
            e.preventDefault();
            document.getElementById('authError').style.display = "none";
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const studentId = document.getElementById('studentIdInput').value;
            handleAuthSubmit(email, password, studentId);
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            checkUserSession();
            location.reload();
        }

        async function checkUserSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            
            if (session) {
                // Query using your exact database table schema names
                const { data: studentData, error } = await _supabase
                    .from('Students') // Notice the capital 'S'
                    .select('course, is_active')
                    .eq('auth_id', session.user.id) // Matching on your custom auth_id column
                    .single();

                // If the student was found but is explicitly set to inactive
                if (!error && studentData && studentData.is_active === false) {
                    alert("თქვენი პროფილი დეაქტივირებულია. გთხოვთ, მიმართოთ ადმინისტრატორს.");
                    await _supabase.auth.signOut();
                    location.reload();
                    return;
                }

                // Standard workflow for active profiles
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('protectedContent').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'block';
                
                authenticatedUserEmail = session.user.email;
                
                if (!error && studentData) {
                    studentCourse = studentData.course;
                    document.getElementById('studentIdInput').value = session.user.id;
                    loadSubjects();
                }
            } else {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('protectedContent').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'none';
            }
        }

        function handleSubjectChange() {
            const selectElement = document.getElementById('subjectSelect');
            const selectedValue = selectElement.value;
            const titleElement = document.getElementById('exerciseTitle');
            const sidebar = document.getElementById('exerciseSidebar');
            const sendBtn = document.querySelector('.send-answers-btn');
            const downloadBtn = document.getElementById('downloadWordBtn');
            const feedback = document.getElementById('resultFeedback');

            // Reset cache when changing weeks
            for (let prop in userAnswersCache) { delete userAnswersCache[prop]; }

            if (!selectedValue) {
                titleElement.innerText = studentCourse ? `${studentCourse} - სავარჯიშოები` : "ონლაინ სავარჯიშოები";

            sidebar.style.display = "flex";

        function saveCurrentBlockAnswersToCache() {
            const subject = document.getElementById('subjectSelect').value;
            if (!studentCourse || !dataset[studentCourse] || !dataset[studentCourse][subject]) return;
            
            const prevBlockData = dataset[studentCourse][subject][currentActiveBlock];
            if (!prevBlockData) return;

            const cacheKeyPrefix = `${subject}_block_${currentActiveBlock}`;

            if (prevBlockData.type === "essay") {
                const essayTextarea = document.getElementById('essayTextarea');
                if (essayTextarea) {
                    userAnswersCache[`${cacheKeyPrefix}_essay`] = essayTextarea.value;
                }
            } else {
                const questions = prevBlockData.questions || [];
                questions.forEach((q, index) => {
                    if (q.type === "mc" || q.type === "vf") {
                        const checkedRadio = document.querySelector(`input[name="question_choice_${index}"]:checked`);
                        if (checkedRadio) {
                            userAnswersCache[`${cacheKeyPrefix}_q_${index}`] = checkedRadio.value;
                        }
                    } else {
                        const input = document.getElementById(`input_q_${index}`);
                        if (input) {
                            userAnswersCache[`${cacheKeyPrefix}_q_${index}`] = input.value;
                        }
                    }
                });
            }
        }

        function loadExerciseBlock(blockNumber) {
            saveCurrentBlockAnswersToCache();
            currentActiveBlock = blockNumber;
            const items = document.querySelectorAll('.sidebar-item');
            items.forEach((item, index) => {
                if ((index + 1) === blockNumber) item.classList.add('active');
                else item.classList.remove('active');
            });
            renderExercise();
        }

        function updateWordCount() {
            const textarea = document.getElementById('essayTextarea');
            if (!textarea) return;
            const text = textarea.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            document.getElementById('wordCounter').innerText = `სიტყვების რაოდენობა: ${words}`;
        }

        function renderExercise() {
            const subject = document.getElementById('subjectSelect').value;
            const container = document.getElementById('exerciseQuestionsContainer');
            const sendBtn = document.querySelector('.send-answers-btn');
            const downloadBtn = document.getElementById('downloadWordBtn');
            document.getElementById('resultFeedback').innerHTML = "";

            // Strictly show actions layout buttons only at the end of the final (6th) exercice block interface window
            if (currentActiveBlock === 6) {
                if (sendBtn) sendBtn.style.display = "inline-flex";
                if (downloadBtn) downloadBtn.style.display = "inline-flex";
            } else {
                if (sendBtn) sendBtn.style.display = "none";
                if (downloadBtn) downloadBtn.style.display = "none";
            }

            if (!studentCourse || !dataset[studentCourse] || !dataset[studentCourse][subject] || !dataset[studentCourse][subject][currentActiveBlock]) {
                container.innerHTML = `<div class="instruction-box" style="border-left-color: var(--secondary); color: var(--secondary);">ამ კვირის სავარჯიშოები მიმდინარე კურსისთვის ჯერ არ არის დამატებული.</div>`;
                return;
            }

            const blockData = dataset[studentCourse][subject][currentActiveBlock]; 
            const instruction = blockData.instruction;
            const cacheKeyPrefix = `${subject}_block_${currentActiveBlock}`;
            
            container.innerHTML = `<div class="instruction-box">${instruction}</div>`;

            // Case 1: Essay Block
            if (blockData.type === "essay") {
                const cachedEssayValue = userAnswersCache[`${cacheKeyPrefix}_essay`] || "";
                const essayDiv = document.createElement('div');
                essayDiv.className = "form-group";
                essayDiv.style.marginTop = "1.5rem";
                essayDiv.innerHTML = `
                    <textarea id="essayTextarea" class="essay-textarea-input" placeholder="დაწერეთ თქვენი ესე აქ..." oninput="updateWordCount()">${cachedEssayValue}</textarea>
                    <div id="wordCounter" class="word-counter-view">სიტყვების რაოდენობა: 0</div>
                `;
                container.appendChild(essayDiv);
                updateWordCount();
                return;
            }

            // Inject audio player if present
            if (blockData.audio) {
                const audioDiv = document.createElement('div');
                audioDiv.className = "audio-player-container";
                audioDiv.innerHTML = `<audio controls src="${blockData.audio}"></audio>`;
                container.appendChild(audioDiv);
            }

            // Inject video player if present
            if (blockData.video) {
                const videoDiv = document.createElement('div');
                videoDiv.className = "video-player-container";
                videoDiv.innerHTML = `<video controls src="${blockData.video}"></video>`;
                container.appendChild(videoDiv);
            }

            // Inject text file presentation box if present
            if (blockData.textFile) {
                const textDiv = document.createElement('div');
                textDiv.className = "text-file-container";
                textDiv.innerHTML = `<strong>[ ${blockData.textFile} ]</strong>\n\nLa colocation est devenue un mode de vie trბs populaire parmi les ღtudiants en France. Face ა la hausse constante du prix des loyers, partager un appartement permet d'ღconomiser beaucoup d'argent. \n\nCependant, vivre en communautღ demande de l'organisation. Le partage des tბches mღnagბres, comme la vaisselle ou le nettoyage, est souvent une source de disputes. Pour ღviter cela, beaucoup de colocataires ღtablissent un rბglement intღrieur dბs le premier jour.\n\nMalgrღ ces petits dღfis, c'est une opportunitღ unique de rencontrer des personnes de cultures diffღrentes et d'apprendre ა vivre ensemble de maniბre harmonieuse.`;
                container.appendChild(textDiv);
            }

            // General Questions Render Loop
            const questions = blockData.questions || [];
            questions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = "exercise-sentence-item";
                const cachedAnswerValue = userAnswersCache[`${cacheKeyPrefix}_q_${index}`] || "";
                
                if (q.type === "mc" || q.type === "vf") {
                    questionDiv.appendChild(document.createTextNode(`${index + 1}. ${q.text}`));
                    const optionsGroup = document.createElement('div');
                    optionsGroup.className = "options-group";
                    
                    q.options.forEach(opt => {
                        const label = document.createElement('label');
                        label.className = "option-label";
                        
                        const radio = document.createElement('input');
                        radio.type = "radio";
                        radio.name = `question_choice_${index}`;
                        radio.value = opt;
                        radio.className = "choice-radio-input";
                        radio.dataset.correctAnswer = q.answer;
                        if (cachedAnswerValue === opt) {
                            radio.checked = true;
                        }
                        
                        label.appendChild(radio);
                        label.appendChild(document.createTextNode(` ${opt}`));
                        optionsGroup.appendChild(label);
                    });
                    questionDiv.appendChild(optionsGroup);
                } else {
                    const parts = q.text.split("_________________");
                    questionDiv.appendChild(document.createTextNode(`${index + 1}. `));
                    
                    // Allow to easily modify width via inline style as requested
                    if (q.text.includes("<br>")) {
                        const labelSpan = document.createElement('span');
                        labelSpan.innerHTML = parts[0];
                        questionDiv.appendChild(labelSpan);
                    } else {
                        questionDiv.appendChild(document.createTextNode(parts[0]));
                    }
                    
                    const input = document.createElement('input');
                    input.type = "text";
                    input.className = "blank-input";
                    
                    // Specific design adjustments for Exercice 5 (Translations)
                    if (currentActiveBlock === 5) {
                        input.style.width = "100%";
                        input.style.borderBottom = "2px solid #b4bfcd";
                        input.style.textAlign = "left";
                        input.style.marginTop = "0.5rem";
                        input.style.display = "block";
                    } else {
                        input.style.width = "150px"; // Easily modifiable space for answer
                    }
                    
                    input.dataset.correctAnswer = q.answer;
                    input.id = `input_q_${index}`;
                    input.autocomplete = "off";
                    input.value = cachedAnswerValue;
                    
                    questionDiv.appendChild(input);
                    if (parts[1]) {
                        if (q.text.includes("<br>")) {
                            const remainingSpan = document.createElement('span');
                            remainingSpan.innerHTML = parts[1];
                            questionDiv.appendChild(remainingSpan);
                        } else {
                            questionDiv.appendChild(document.createTextNode(parts[1]));
                        }
                    }
                }
                
                container.appendChild(questionDiv);
            });
        }

        function gatherAllBlockDataAndAnswers(includeValidation = false) {
            const subject = document.getElementById('subjectSelect').value;
            let fullStructuredPayload = "";

            // Loop and compile logs for all 6 exercises blocks
            for (let b = 1; b <= 6; b++) {
                const blockData = dataset[studentCourse]?.[subject]?.[b];
                if (!blockData) {
                    fullStructuredPayload += `\n=========================================\nExercice ${b}: (მონაცემები არ არის დამატებული)\n=========================================\n`;
                    continue;
                }

                fullStructuredPayload += `\n=========================================\nExercice ${b}: ${blockData.instruction}\n=========================================\n`;
                const cacheKeyPrefix = `${subject}_block_${b}`;

                if (blockData.type === "essay") {
                    let textContent = "";
                    if (b === currentActiveBlock) {
                        const essayTextarea = document.getElementById('essayTextarea');
                        textContent = essayTextarea ? essayTextarea.value.trim() : "";
                    } else {
                        textContent = (userAnswersCache[`${cacheKeyPrefix}_essay`] || "").trim();
                    }
                    const wordsCount = textContent ? textContent.split(/\s+/).length : 0;
                    fullStructuredPayload += `ესეს ტიპის დავალება:\nსიტყვების რაოდენობა: ${wordsCount}\nტექსტი:\n${textContent || "(ცარიელი)"}\n`;
                } else {
                    const questions = blockData.questions || [];
                    questions.forEach((q, index) => {
                        let studentAns = "";
                        if (b === currentActiveBlock) {
                            if (q.type === "mc" || q.type === "vf") {
                                const checkedRadio = document.querySelector(`input[name="question_choice_${index}"]:checked`);
                                studentAns = checkedRadio ? checkedRadio.value : "";
                            } else {
                                const input = document.getElementById(`input_q_${index}`);
                                studentAns = input ? input.value.trim() : "";
                            }
                        } else {
                            studentAns = (userAnswersCache[`${cacheKeyPrefix}_q_${index}`] || "").trim();
                        }

                        if (!studentAns) studentAns = "______";

                        let statusSuffix = "";
                        // Removed corrections/validations checking logic for open/all questions based on requested parameter override

                        const originalText = q.text.replace(/<br>/g, " ");
                        const completedSentence = originalText.includes("_________________") ? 
                            originalText.replace("_________________", ` [ ${studentAns} ] `) : 
                            `${originalText} -> პასუხი: [ ${studentAns} ]`;

                        fullStructuredPayload += `${index + 1}: ${completedSentence}${statusSuffix}\n`;
                    });
                }
            }
            return { payload: fullStructuredPayload };
        }

        function sendAnswersToEmail() {
            saveCurrentBlockAnswersToCache();
            const subjectSelect = document.getElementById('subjectSelect');
            const subject = subjectSelect.value;
            const selectedWeek = subjectSelect.options[subjectSelect.selectedIndex].text;
            const studentId = document.getElementById('studentIdInput').value || "N/A";
            const feedback = document.getElementById('resultFeedback');

            const resultsData = gatherAllBlockDataAndAnswers(false); // Forced false to remove corrections

            // Removed how many questions were correct score view text block
            feedback.innerHTML = `<span style="color: var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> იგზავნება...</span>`;

            // EmailJS Integration Area
            emailjs.init("ubHY-_bGG6-4A4a3d");

            const templateParams = {
                to_email: "ouispeakinfo@gmail.com",
                from_email: authenticatedUserEmail, 
                student_id: studentId,
                course: studentCourse,
                week: selectedWeek,
                exercise_block: "ყველა ბლოკი (1-6)",
                answers_payload: resultsData.payload
            };

            emailjs.send("service_4k5phem", "template_dpz0tuk", templateParams)
                .then(() => {
                    // Removed the score from the success message
                    feedback.innerHTML = `<span style="color: #10b981;"><i class="fa-solid fa-circle-check"></i> 6-ვე სავარჯიშოს პასუხები წარმატებით გაიგზავნა!</span>`;
                }, (error) => {
                    console.error("Email delivery failed:", error);
                    feedback.innerHTML = `<span style="color: var(--secondary);"><i class="fa-solid fa-circle-xmark"></i> გაგზავნა ვერ მოხერხდა. სცადეთ მოგვიანებით.</span>`;
                });
        }

        function downloadWordFile() {
            saveCurrentBlockAnswersToCache();
            const subjectSelect = document.getElementById('subjectSelect');
            const selectedWeek = subjectSelect.options[subjectSelect.selectedIndex].text;
            
            const resultsData = gatherAllBlockDataAndAnswers(false);
            
            // Generate clean standard web-doc architecture schema data layout string stream
            const headerInfo = `OuiSpeak სავარჯიშოების ანგარიში\nკურსი: ${studentCourse || 'N/A'}\nკვირა: ${selectedWeek}\nსტუდენტის ID: ${document.getElementById('studentIdInput').value || 'N/A'}\n-----------------------------------------\n`;
            const finalStringContent = headerInfo + resultsData.payload;
            
            const blob = new Blob([finalStringContent], { type: "application/msword;charset=utf-8" });
            const downloadUrl = URL.createObjectURL(blob);
            
            const temporaryAnchor = document.createElement('a');
            temporaryAnchor.href = downloadUrl;
            temporaryAnchor.download = `${studentCourse || 'OuiSpeak'}_${selectedWeek}_Exercises.doc`;
            document.body.appendChild(temporaryAnchor);
            temporaryAnchor.click();
            document.body.removeChild(temporaryAnchor);
            URL.revokeObjectURL(downloadUrl);
        }

        checkUserSession();
    </script>
